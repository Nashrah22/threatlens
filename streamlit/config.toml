# Place this file at .streamlit/config.toml
# This pins Streamlit's OWN internal theme to a known baseline so its native
# widgets (dropdowns, radio buttons, focus rings) don't clash with the
# in-app light/dark toggle, which is handled separately via custom CSS.

[theme]
base = "dark"
primaryColor = "#5b8cff"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#131a2a"
textColor = "#e8ebf3"
font = "sans serif"

[server]
headless = true
